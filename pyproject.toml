[project]
name = "civicwater-sentinel-backend"
version = "0.1.0"
description = "CivicWater Sentinel - Backend & Ingestion (FastAPI ingestion and orchestration)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Runtime of the real forecaster (DEP-ML-03): `pip install -e ".[ml]"` or `uv sync --extra ml`.
# Not needed by CI or the mocks; the VM image already has them in /opt/venv.
ml = [
    "numpy>=2.0",
    "xgboost>=3.0",
    "snapml>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[dependency-groups]
dashboard = [
    "ipywidgets>=8.1.9",
    "streamlit>=1.66.0",
]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "dashboard"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "dashboard"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ipywidgets", "ipywidgets.*"]  # no type information shipped
ignore_missing_imports = true
